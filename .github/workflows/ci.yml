name: CI

on:
  push:
    branches: [ master ]
    tags-ignore: [ '**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Syntax check every PHP file
        run: |
          find . -path ./vendor -prune -o -path ./tests -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--no-interaction --prefer-dist'

      - name: Run phpcs
        run: vendor/bin/phpcs

  phpunit:
    name: PHPUnit ${{ matrix.php }}${{ matrix.woocommerce == 'yes' && ' + WooCommerce' || ' (WordPress only)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            woocommerce: 'yes'
          - php: '8.4'
            woocommerce: 'yes'
          - php: '8.4'
            woocommerce: 'no'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: newsman_wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DB_NAME: newsman_wp_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_TESTS_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--no-interaction --prefer-dist'

      - name: Install WooCommerce
        if: matrix.woocommerce == 'yes'
        run: tests/bin/install-woocommerce.sh

      - name: Run PHPUnit
        run: vendor/bin/phpunit
